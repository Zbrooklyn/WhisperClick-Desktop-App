<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Control Tower</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f68e0'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white'%3E%E2%97%AA%3C/text%3E%3C/svg%3E">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f1f3f7; --surface-3:#e9edf3;
    --ink:#14161c; --muted:#586072; --faint:#8b93a3;
    --line:#e7eaf0; --line-strong:#d7dce6;
    --accent:#2f68e0; --accent-ink:#1f4fb8; --accent-soft:#eaf1fe;
    --good:#178a55; --good-soft:#e6f4ec;
    --warn:#b26a12; --warn-soft:#fbefdc;
    --danger:#c23b34; --danger-soft:#fbe9e7;
    --idle:#9aa3b2; --idle-soft:#eef0f4;
    --radius:13px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(20,22,28,.04), 0 6px 22px rgba(20,22,28,.055);
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1014; --surface:#171a20; --surface-2:#1e222a; --surface-3:#262b34;
    --ink:#eef1f6; --muted:#9aa4b4; --faint:#6b7482;
    --line:#252a33; --line-strong:#333a45;
    --accent:#5b8def; --accent-ink:#bcd2fb; --accent-soft:#1a2740;
    --good:#3bb980; --good-soft:#12271e;
    --warn:#d79a4a; --warn-soft:#2a2113;
    --danger:#e0685f; --danger-soft:#2c1615;
    --idle:#6b7482; --idle-soft:#20252e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }}
  :root[data-theme="light"]{
    --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f1f3f7; --surface-3:#e9edf3;
    --ink:#14161c; --muted:#586072; --faint:#8b93a3;
    --line:#e7eaf0; --line-strong:#d7dce6;
    --accent:#2f68e0; --accent-ink:#1f4fb8; --accent-soft:#eaf1fe;
    --good:#178a55; --good-soft:#e6f4ec; --warn:#b26a12; --warn-soft:#fbefdc;
    --danger:#c23b34; --danger-soft:#fbe9e7; --idle:#9aa3b2; --idle-soft:#eef0f4;
    --shadow:0 1px 2px rgba(20,22,28,.04), 0 6px 22px rgba(20,22,28,.055);
  }
  :root[data-theme="dark"]{
    --bg:#0e1014; --surface:#171a20; --surface-2:#1e222a; --surface-3:#262b34;
    --ink:#eef1f6; --muted:#9aa4b4; --faint:#6b7482;
    --line:#252a33; --line-strong:#333a45;
    --accent:#5b8def; --accent-ink:#bcd2fb; --accent-soft:#1a2740;
    --good:#3bb980; --good-soft:#12271e; --warn:#d79a4a; --warn-soft:#2a2113;
    --danger:#e0685f; --danger-soft:#2c1615; --idle:#6b7482; --idle-soft:#20252e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--ui);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .num{font-variant-numeric:tabular-nums}
  code,.mono{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:11px 22px;background:color-mix(in srgb,var(--surface) 88%,transparent);
    backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:14px;min-width:0}
  .brand .mark{width:23px;height:23px;border-radius:7px;background:var(--accent);flex:none;
    display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .brand .sub{color:var(--faint);font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .right{display:flex;align-items:center;gap:7px;flex:none}
  .iconbtn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);
    color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;
    font-size:14px}
  .iconbtn:hover{color:var(--ink);border-color:var(--faint)}
  .freshness{font-size:12px;color:var(--faint);white-space:nowrap}
  .freshness.stale{color:var(--warn)}
  .freshness .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--good);margin-right:5px;vertical-align:middle}
  .freshness.stale .dot{background:var(--warn)}
  .freshness.offline .dot{background:var(--danger)}

  .wrap{max-width:1000px;margin:0 auto;padding:24px 22px 80px}

  /* ---------- hero / KPI header ---------- */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 24px;margin-bottom:14px}
  .hero-top{display:flex;gap:24px;align-items:center}
  .ring{position:relative;width:120px;height:120px;flex:none}
  .ring svg{transform:rotate(-90deg);display:block}
  .ring .track{stroke:var(--surface-2)}
  .ring .fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
  .ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .ring .figure{display:flex;align-items:baseline;font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .ring .figure i{font-style:normal;font-size:15px;color:var(--muted);font-weight:650;margin-left:1px}
  .ring .cap{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:600}

  .hero-main{flex:1;min-width:0}
  .hero-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .statuschip{font-size:11px;font-weight:650;padding:2px 9px;border-radius:99px;
    background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .statuschip.approved{background:var(--good-soft);color:var(--good);border-color:transparent}
  .ver{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .hero-main h1{margin:0;font-size:22px;font-weight:730;letter-spacing:-.02em;text-wrap:balance}
  .hero-main .goal{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}
  .hero-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line-strong);color:var(--muted);background:var(--surface)}
  .tag.phase{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:20px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
  .kpi{background:var(--surface);padding:13px 15px}
  .kpi b{display:block;font-family:var(--mono);font-size:21px;font-weight:640;letter-spacing:-.02em;line-height:1.1}
  .kpi b span{font-size:.62em;color:var(--faint);font-weight:730}
  .kpi>span{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}

  /* attention banner */
  .attention{display:flex;gap:11px;align-items:flex-start;margin-top:16px;padding:13px 15px;border-radius:var(--radius-sm)}
  .attention.you{background:var(--danger-soft)}
  .attention.clear{background:var(--good-soft)}
  .attention .ic{flex:none;width:9px;height:9px;border-radius:99px;margin-top:6px}
  .attention.you .ic{background:var(--danger)}
  .attention.clear .ic{background:var(--good)}
  .attention .lead{font-weight:650;font-size:13.5px}
  .attention.you .lead{color:var(--danger)}
  .attention.clear .lead{color:var(--good)}
  .attention .next{display:block;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--ink);font-size:13px}
  .attention .next b{font-weight:650}

  /* ---------- tabs ---------- */
  .tabbar{position:sticky;top:52px;z-index:30;display:flex;align-items:center;gap:2px;
    background:var(--bg);border-bottom:1px solid var(--line);margin:22px 0 18px;padding-top:2px}
  .tab{appearance:none;background:none;border:0;cursor:pointer;font-size:13.5px;font-weight:600;
    color:var(--muted);padding:11px 13px;margin-bottom:-1px;border-bottom:2px solid transparent;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  .tab .n{color:var(--faint);font-weight:600;margin-left:6px;font-size:12px;font-variant-numeric:tabular-nums}
  .tab.active .n{color:var(--accent-ink)}
  .tab .alert{color:var(--danger);margin-left:6px;font-size:11px}
  .morewrap{position:relative;display:none}
  .morebtn{appearance:none;background:none;border:0;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);padding:11px 13px}
  .moremenu{position:absolute;right:0;top:100%;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:170px;z-index:50;display:none}
  .moremenu.open{display:block}
  .moremenu button{display:flex;justify-content:space-between;width:100%;background:none;border:0;cursor:pointer;
    text-align:left;padding:9px 11px;border-radius:7px;color:var(--ink);font-size:13.5px}
  .moremenu button:hover{background:var(--surface-2)}
  .moremenu button .n{color:var(--faint);font-size:12px}
  .panel[hidden]{display:none}

  /* ---------- generic cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .card-h{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
  .card-h h2{margin:0;font-size:14px;font-weight:680;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .card-h .lead{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .card-b{padding:14px 18px}
  .eyebrow{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--faint)}

  /* overview specifics */
  .ov-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:start}
  .constraint{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);
    box-shadow:var(--shadow);border-radius:var(--radius);padding:15px 18px;margin-bottom:12px}
  .constraint .eyebrow{color:var(--warn)}
  .constraint p{margin:5px 0 0;font-size:13.5px}
  .list-rows{display:flex;flex-direction:column}
  .row{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
  .row:first-child{border-top:0}
  .row .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px;color:#fff}
  .row.done .box{background:var(--good);border-color:var(--good)}
  .row.done .txt{color:var(--faint)}
  .row .txt{flex:1;min-width:0}
  .owner{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);margin-right:6px;vertical-align:1px}
  .owner.claude{background:var(--idle-soft);color:var(--muted)}
  .chip{font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .chip.block{background:var(--danger-soft);color:var(--danger)}
  .chip.proof{background:var(--good-soft);color:var(--good)}
  .chip.unver{background:var(--warn-soft);color:var(--warn)}
  .subnote{font-size:12px;color:var(--muted);margin-top:2px}
  .subnote.block{color:var(--danger)}
  .aside-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;margin-bottom:12px}
  .aside-card .big{font-size:23px;font-weight:750;letter-spacing:-.02em;margin:6px 0 2px}
  .aside-card .eyebrow+*{margin-top:6px}
  .goalbar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:9px}
  .goalbar i{display:block;height:100%;background:var(--good);border-radius:99px}
  .empty{color:var(--faint);font-size:13px;padding:6px 0}
  .muted-sm{color:var(--muted);font-size:12.5px}

  /* phase cards */
  .phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .phase.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
  .ph-head{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer;user-select:none}
  .ph-idx{width:27px;height:27px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--idle-soft);color:var(--muted)}
  .phase.done .ph-idx{background:var(--good-soft);color:var(--good)}
  .phase.current .ph-idx{background:var(--accent-soft);color:var(--accent-ink)}
  .ph-title{flex:1;min-width:0}
  .ph-title b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em}
  .ph-title .sub{font-size:12px;color:var(--faint);margin-top:1px}
  .ph-meta{display:flex;align-items:center;gap:12px;flex:none}
  .ph-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  .ph-bar{height:6px;background:var(--surface-2);position:relative;overflow:hidden}
  .ph-bar i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--accent);transform-origin:left center;transition:transform .2s linear}
  .phase.done .ph-bar i{background:var(--good)}
  .ph-items{padding:6px 18px 14px;border-top:1px solid var(--line)}
  .ph-obj{font-size:12.5px;color:var(--muted);padding:9px 0 4px}
  .ph-collapsed .ph-items{display:none}

  /* timeline */
  .tl{position:relative;margin:2px 0 0 8px;padding-left:26px}
  .tl::before{content:"";position:absolute;left:0;top:6px;bottom:10px;width:2px;background:var(--line-strong)}
  .tl-node{position:relative;padding:0 0 18px}
  .tl-dot{position:absolute;left:-31px;top:2px;width:15px;height:15px;border-radius:99px;background:var(--surface);border:2px solid var(--line-strong)}
  .tl-node.done .tl-dot{background:var(--good);border-color:var(--good)}
  .tl-node.current .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .tl-name{font-weight:650;font-size:14px}
  .tl-node.current .tl-name{color:var(--accent-ink)}
  .tl-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tl-gate{font-size:11.5px;color:var(--warn);margin-top:3px}

  /* decisions / risks */
  .reg-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  .reg-row:first-child{border-top:0}
  .reg-main{flex:1;min-width:0}
  .reg-main b{font-size:13.5px;font-weight:600}
  .reg-main .d{font-size:12.5px;color:var(--muted);margin-top:2px}
  .badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;flex:none}
  .badge.resolved{background:var(--good-soft);color:var(--good)}
  .badge.pending{background:var(--warn-soft);color:var(--warn)}
  .badge.default{background:var(--idle-soft);color:var(--muted)}
  .badge.declined{background:var(--surface-2);color:var(--faint)}
  .badge.critical{background:var(--danger);color:#fff}
  .badge.high{background:var(--danger-soft);color:var(--danger)}
  .badge.medium{background:var(--warn-soft);color:var(--warn)}

  /* checklist controls */
  .controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .search{flex:1;min-width:160px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:9px;padding:9px 12px;font-size:13.5px}
  .toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;
    border:1px solid var(--line-strong);background:var(--surface);padding:8px 11px;border-radius:9px}
  .toggle input{accent-color:var(--accent)}

  /* full plan reader */
  .reader-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
  .seg button{background:var(--surface);border:0;padding:8px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .jump{position:relative}
  .jumpbtn{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .jumpmenu{position:absolute;left:0;top:100%;margin-top:5px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:200px;max-height:340px;overflow:auto;z-index:20;display:none}
  .jumpmenu.open{display:block}
  .jumpmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 11px;border-radius:7px;color:var(--ink);font-size:13px;cursor:pointer}
  .jumpmenu button:hover{background:var(--surface-2)}
  .jumpmenu button.lvl3{padding-left:22px;color:var(--muted);font-size:12.5px}
  .reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 26px 26px}
  .reader h1{font-size:21px;font-weight:730;margin:20px 0 8px;letter-spacing:-.02em}
  .reader h2{font-size:16px;font-weight:680;margin:24px 0 8px;letter-spacing:-.01em;scroll-margin-top:120px;padding-top:6px;border-top:1px solid var(--line)}
  .reader h2:first-of-type{border-top:0}
  .reader h3{font-size:13.5px;font-weight:680;margin:16px 0 6px;color:var(--muted);scroll-margin-top:120px}
  .reader p{margin:8px 0}
  .reader ul{margin:6px 0;padding-left:2px;list-style:none}
  .reader li{display:flex;gap:9px;padding:3px 0;font-size:13.5px}
  .reader li .b{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff}
  .reader li.done .b{background:var(--good);border-color:var(--good)}
  .reader li.done{color:var(--faint)}
  .reader li.plain{display:list-item;margin-left:20px;list-style:disc}
  .reader li.desc-line{display:block;padding:1px 0 3px 25px;color:var(--muted);font-size:12.5px;line-height:1.5}
  .reader blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line-strong);color:var(--muted)}
  .reader .meta-line{color:var(--muted);font-size:13px;margin:2px 0}
  .reader hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  .reader pre.raw{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--ink);
    background:var(--surface-2);padding:18px;border-radius:10px;overflow-x:auto}

  /* activity */
  .act-row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
  .act-row:first-child{border-top:0}
  .act-dot{width:9px;height:9px;border-radius:99px;background:var(--good);flex:none;margin-top:5px}
  .act-dot.edit{background:var(--accent)}
  .act-time{font-size:11.5px;color:var(--faint);margin-top:1px}

  .stalebanner{position:sticky;top:92px;z-index:25;display:none;align-items:center;gap:10px;justify-content:center;
    background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:99px;
    padding:7px 15px;font-size:12.5px;font-weight:600;margin:0 auto 12px;width:max-content;cursor:pointer}
  .stalebanner.show{display:flex}

  /* ---------- clickable affordances ---------- */
  .row.clickable{cursor:pointer;border-radius:8px;transition:background .12s}
  .row.clickable:hover{background:var(--surface-2)}
  .rowgo{margin-left:auto;align-self:center;color:var(--faint);opacity:0;font-size:17px;flex:none;transition:opacity .12s;padding-left:6px}
  .row.clickable:hover .rowgo{opacity:1}
  .aside-card.clickable,.tl-node.clickable{cursor:pointer}
  .aside-card.clickable{transition:border-color .12s}
  .aside-card.clickable:hover{border-color:var(--line-strong)}
  .tl-node.clickable:hover .tl-name{color:var(--accent-ink)}
  .attention .next.clickable{cursor:pointer}
  .attention .next.clickable:hover{text-decoration:underline}
  .phase.flash{animation:phflash 1.1s ease}
  @keyframes phflash{0%,100%{box-shadow:var(--shadow)}28%{box-shadow:0 0 0 2px var(--accent),var(--shadow)}}

  /* ---------- item detail drawer ---------- */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(10,12,16,.42);z-index:60;opacity:0;transition:opacity .18s}
  body.drawer-open .drawer-backdrop{opacity:1}
  .drawer-backdrop[hidden]{display:none}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,92vw);background:var(--surface);
    border-left:1px solid var(--line-strong);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:70;
    transform:translateX(101%);transition:transform .2s ease;display:flex;flex-direction:column;overflow:hidden}
  body.drawer-open .drawer{transform:none}
  .dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .dr-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.02em}
  .dr-status.done{background:var(--good-soft);color:var(--good)}
  .dr-status.open{background:var(--accent-soft);color:var(--accent-ink)}
  .dr-status.blocked{background:var(--danger-soft);color:var(--danger)}
  .dr-status.waiting{background:var(--warn-soft);color:var(--warn)}
  .dr-close{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:12px}
  .dr-close:hover{color:var(--ink);border-color:var(--faint)}
  .dr-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
  .dr-item{font-size:16px;font-weight:650;line-height:1.42;letter-spacing:-.01em}
  .dr-desc{font-size:13.5px;line-height:1.55;color:var(--ink)}
  .dr-lbl{display:block;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;
    font-weight:600;color:var(--faint);margin-bottom:3px}
  .dr-hint{font-size:13px;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-radius:9px}
  .dr-metagrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dr-mcell{min-width:0}
  .dr-owner{font-size:13px;font-weight:600}
  .dr-phase{appearance:none;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);
    border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:650;cursor:pointer;width:100%;text-align:left}
  .dr-phase:hover{background:var(--accent);color:#fff}
  .dr-note{font-size:13px;padding:10px 12px;border-radius:9px;background:var(--surface-2);line-height:1.45}
  .dr-note.block{background:var(--danger-soft);color:var(--danger)}
  .dr-note.block .dr-lbl{color:var(--danger)}
  .dr-note.ok{background:var(--good-soft);color:var(--good)}
  .dr-note.ok .dr-lbl{color:var(--good)}
  .dr-note.warn{background:var(--warn-soft);color:var(--warn)}
  .dr-note.warn .dr-lbl{color:var(--warn)}
  .dr-sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
  .dr-seclead{font-size:12px;color:var(--muted);margin-top:-3px}
  .dr-link{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600}
  @media(max-width:640px){ .drawer{width:100vw} }

  /* ---------- responsive: tablet ---------- */
  @media(max-width:980px){
    .wrap{padding:20px 18px 70px}
    .ov-grid{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(4,1fr)}
  }
  /* ---------- responsive: mobile ---------- */
  @media(max-width:640px){
    .topbar{padding:10px 15px}
    .brand .sub{display:none}
    .freshness .txt{display:none}
    .wrap{padding:15px 13px 60px}
    .hero{padding:18px 16px 16px}
    .hero-top{flex-direction:column;align-items:center;gap:14px}
    .ring{width:104px;height:104px}
    .ring svg{width:104px;height:104px}
    .hero-main{width:100%}
    .hero-eyebrow{justify-content:flex-start}
    .hero-main h1{font-size:19px}
    .hero-main .goal{font-size:12.5px}
    .hero-tags .tag.items{display:none}
    .kpis{grid-template-columns:repeat(3,1fr);margin-top:16px}
    .kpis .kpi.dup{display:none}
    .kpi{padding:11px 12px}
    .kpi b{font-size:20px}
    .kpi>span{font-size:11px}
    .tabbar{top:50px;overflow-x:auto;scrollbar-width:none}
    .tabbar::-webkit-scrollbar{display:none}
    .tabbar.hasmore{overflow:visible}
    .tabbar.hasmore .tab.sec{display:none}
    .morewrap{display:block;margin-left:auto}
    .tab{padding:10px 11px;font-size:13px}
    .ph-head{gap:11px;padding:13px 15px}
    .ph-title b{font-size:14px}
    .stalebanner{top:88px}
    .reader{padding:6px 16px 22px}
  }
  @media(max-width:380px){ .hero-main h1{font-size:18px} .kpis{grid-template-columns:repeat(2,1fr)} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

# Brooklyn Battery Works — Relaunch
> Restore trustworthy measurement, rebuild lifecycle revenue, and repair SEO for a 10-year BigCommerce store — without shipping unapproved live changes.

Status: Draft — not approved
Version: v0.3
Owner: Edward
Goal: ≥ $5k/mo email-attributed revenue, sustained
Constraint: Trustworthy measurement comes first — GA4 currently records only ~27% of real revenue, so every downstream number is suspect until it's fixed.

## Phase 1 — Foundation, Access & Safety
Objective: Get the access and guardrails in place so no later work is blind or destructive.
- [x] Confirm GA4 property is readable via service account (proof: API returns 90-day sessions)
- [x] Document the canonical source of truth (proof: this PLAN.md)
- [x] Establish the release rule: every live change stays owner-gated
- [ ] @edward Grant BigCommerce admin access
- [ ] @edward Grant Search Console owner access

## Phase 2 — Measurement & Analytics
Objective: Make the numbers trustworthy before acting on them.
Gate: needs Phase 1 access
- [x] Reconcile last-90-day revenue: GA vs BigCommerce vs Klaviyo (proof: variance table, 27% gap)
- [x] Map the attribution collapse into Direct / Unassigned
- [ ] Repair UTM tagging across paid + email (blocked: needs BigCommerce admin)
- [ ] Restore purchase-value tracking
- [ ] @edward Approve the new UTM taxonomy before rollout

## Phase 3 — Technical SEO & Indexing
Objective: Stop the slow bleed of organic traffic.
Gate: needs Search Console access
- [x] Locate the real sitemap (proof: /xmlsitemap.php, ~2,372 URLs)
- [ ] Fix /sitemap.xml returning 404
- [ ] Audit indexation coverage (blocked: needs Search Console access)
- [ ] Repair broken browse & cart tracking events

## Phase 4 — Lifecycle & Revenue
Objective: Turn dormant email into the ≥ $5k/mo engine.
Gate: needs Phase 2 measurement verified
- [ ] Turn on the 17 lifecycle flows currently OFF
- [ ] Rebuild the welcome + abandoned-cart series
- [ ] @edward Approve send to the re-engaged segment (~950k profiles)
- [ ] Set the always-on flow-share target

## Phase 5 — Conversion & Trust
Objective: Make the traffic we recover actually convert.
- [ ] Audit on-page SEO + content gaps
- [ ] Repair website UX & conversion fundamentals
- [ ] Rebuild trust & brand signals on key templates

## Phase 6 — Reporting & Handoff
Objective: Make progress legible and hand back a running machine.
- [ ] Stand up accountable reporting the client can read
- [ ] Reach ≥ $5k/mo email-attributed revenue, sustained
- [ ] @edward Client retained + market-ready sign-off

## Decisions
- Use GA4 (not BigCommerce Analytics) as the revenue source of truth (resolved: GA4 with server-side backfill)
- UTM taxonomy standard for paid + email (pending: waiting on Edward's approval in Phase 2)
- Email platform stays Klaviyo vs migrate (default: stay on Klaviyo unless a blocker appears)
- Whether to touch live theme before measurement is fixed (declined: no live changes until Phase 2 verified)

## Risks
- Acting on wrong numbers before measurement is fixed (critical) — containment: no revenue decisions until Phase 2 reconciliation is verified
- 950k-profile send hits spam traps and burns domain reputation (high) — containment: re-engage in small warmed batches, sunset dead profiles first
- Sitemap/indexing fix temporarily drops rankings (medium) — containment: stage on a test property, diff before publishing
- Lifecycle flows double-send during rebuild (medium) — containment: build in draft, single smoke-test profile before enabling

## Success criteria
- GA4-reported revenue within 5% of BigCommerce settled revenue
- All 6 phases verified, not just checked
- ≥ $5k/mo email-attributed revenue sustained for 60 days
- Client signs the market-ready handoff

## Notes
- This is a legacy rescue, not a greenfield build — recover truth before changing anything.
- The release rule is absolute: nothing goes live without Edward's explicit gate.
