<!doctype html><html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{background:#141110;color:#f2ece3;font-family:"Segoe UI",system-ui,sans-serif;width:1440px;padding:0}
  section{padding:26px 30px 32px;border-bottom:1px solid #2a231e}
  .shead{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
  .shead h2{font-family:Georgia,serif;font-size:26px;font-weight:600;color:#f2ece3;letter-spacing:-.01em}
  .shead .k{font-size:12px;color:#cd8a5e;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  figure{background:#1f1a16;border:1px solid #322a24;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  figcaption{padding:10px 13px;font-size:13px;font-weight:600;color:#f2ece3;border-bottom:1px solid #322a24;display:flex;align-items:center;gap:8px}
  figcaption::before{content:"";width:7px;height:7px;border-radius:50%;background:#66b088;flex:0 0 auto}
  .imgwrap{background:#0e0b09;display:block}
  img{width:100%;height:auto;display:block}
</style></head><body>

<section id="s-home">
  <div class="shead"><span class="k">Capture</span><h2>Home &amp; capture</h2></div>
  <div class="grid">
    <figure><figcaption>Recorder · Local/API · model select · history</figcaption><div class="imgwrap"><img src="cap-home-clean.png"></div></figure>
    <figure><figcaption>Live search across history</figcaption><div class="imgwrap"><img src="gap-search.png"></div></figure>
    <figure><figcaption>Note detail — Transcript/Review/Ask</figcaption><div class="imgwrap"><img src="cap-detail-clean.png"></div></figure>
  </div>
</section>

<section id="s-review">
  <div class="shead"><span class="k">AI Review</span><h2>Review &amp; summary</h2></div>
  <div class="grid">
    <figure><figcaption>Length + Type pickers, editable summary, action items</figcaption><div class="imgwrap"><img src="gap-review.png"></div></figure>
    <figure><figcaption>Editable summary (Edit / Regenerate)</figcaption><div class="imgwrap"><img src="shot-edit-summary.png"></div></figure>
    <figure><figcaption>Decisions vs action items · owner + due</figcaption><div class="imgwrap"><img src="shot-review-details.png"></div></figure>
    <figure><figcaption>Key quotes with timestamps</figcaption><div class="imgwrap"><img src="cap-key-quotes.png"></div></figure>
    <figure><figcaption>Auto-chapters for long videos</figcaption><div class="imgwrap"><img src="cap-chapters-section.png"></div></figure>
  </div>
</section>

<section id="s-ask">
  <div class="shead"><span class="k">Ask</span><h2>Ask your notes (chat)</h2></div>
  <div class="grid">
    <figure><figcaption>Streaming replies</figcaption><div class="imgwrap"><img src="cap-chat-stream.png"></div></figure>
    <figure><figcaption>Answer cites exact transcript line</figcaption><div class="imgwrap"><img src="shot-cite.png"></div></figure>
    <figure><figcaption>Pin an answer back into the note</figcaption><div class="imgwrap"><img src="shot-pin.png"></div></figure>
    <figure><figcaption>Fast / Smart model toggle</figcaption><div class="imgwrap"><img src="shot-chat-quality.png"></div></figure>
  </div>
</section>

<section id="s-actions">
  <div class="shead"><span class="k">Actions</span><h2>Actions &amp; prompt library</h2></div>
  <div class="grid">
    <figure><figcaption>Prompt library + auto-suggested action</figcaption><div class="imgwrap"><img src="shot-suggest-action.png"></div></figure>
    <figure><figcaption>Preview result + one-tap undo (replace)</figcaption><div class="imgwrap"><img src="shot-action-apply.png"></div></figure>
    <figure><figcaption>Batch action across notes</figcaption><div class="imgwrap"><img src="shot-batch.png"></div></figure>
  </div>
</section>

<section id="s-speakers">
  <div class="shead"><span class="k">Speakers</span><h2>Speaker ID</h2></div>
  <div class="grid">
    <figure><figcaption>Rename speakers (A→Edward, B→Claude)</figcaption><div class="imgwrap"><img src="shot-speakers.png"></div></figure>
    <figure><figcaption>Talk-time share + Summaries / Merge tools</figcaption><div class="imgwrap"><img src="shot-speaker-summaries.png"></div></figure>
  </div>
</section>

<section id="s-import">
  <div class="shead"><span class="k">Import + Re-transcribe</span><h2>Import, URL &amp; re-transcribe</h2></div>
  <div class="grid">
    <figure><figcaption>URL import card</figcaption><div class="imgwrap"><img src="cap-urlcard-fresh2.png"></div></figure>
    <figure><figcaption>Rich link preview</figcaption><div class="imgwrap"><img src="cap-rich-vimeo.png"></div></figure>
    <figure><figcaption>Time-range import</figcaption><div class="imgwrap"><img src="cap-url-range.png"></div></figure>
    <figure><figcaption>Queue several URLs</figcaption><div class="imgwrap"><img src="cap-url-queue.png"></div></figure>
    <figure><figcaption>Trim before transcribing</figcaption><div class="imgwrap"><img src="cap-file-trim.png"></div></figure>
    <figure><figcaption>Cost/time estimate + custom vocabulary</figcaption><div class="imgwrap"><img src="cap-retr-vocab.png"></div></figure>
    <figure><figcaption>Batch re-transcribe</figcaption><div class="imgwrap"><img src="cap-batch-retr.png"></div></figure>
    <figure><figcaption>Send: summary vs full</figcaption><div class="imgwrap"><img src="cap-send-toggle.png"></div></figure>
  </div>
</section>

</body></html>
