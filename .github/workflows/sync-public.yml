name: Sync public (free) repo

# Publishes the free version of the monorepo to the public repo on every push
# to main. The public repo = this tree minus premium code and internal docs.
#
# Safety: the actual filtering + publishing lives in tools/sync_public.sh, which
# runs three fail-closed gates before it pushes anything:
#   1. premium-present guard       — abort if expected premium dirs are missing
#   2. post-strip verification     — abort if any premium/internal file survives
#   3. secret scan                 — abort if key/token patterns appear
# If any gate trips, nothing is published. It also PRESERVES the public repo's
# own docs/updates/ feed (which the public build publishes from public-built
# installers) so a sync never overwrites it with private-repo URLs.
#
# Auth: an SSH deploy key (secret PUBLIC_REPO_DEPLOY_KEY) whose public half is
# a write deploy key on Zbrooklyn/WhisperClick-Desktop-App. A deploy key is
# scoped to that one repo, never expires, and is revoked by deleting the key —
# strictly narrower than a personal access token. Until the secret exists, this
# workflow safely skips (no publish).
#
# Manual test: run via "Run workflow" with target_branch set to a throwaway
# branch (e.g. deploy-key-test) to exercise auth + the strip + feed-preserve
# against the public repo WITHOUT touching its main branch / the live feed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Public branch to push to (use a throwaway branch to test safely)"
        required: false
        default: "main"

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy key configured
        id: gate
        env:
          KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "PUBLIC_REPO_DEPLOY_KEY not set — skipping public sync."
            echo "Add the secret (SSH deploy key private half) to enable publishing."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (full history)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up deploy key
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Configure git identity and public remote
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "whisperclick-sync[bot]"
          git config user.email "sync@users.noreply.github.com"
          git remote add public git@github.com:Zbrooklyn/WhisperClick-Desktop-App.git

      - name: Run guarded sync
        if: steps.gate.outputs.enabled == 'true'
        env:
          GIT_SSH_COMMAND: "ssh -i /home/runner/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          PUBLIC_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}
        run: bash tools/sync_public.sh
